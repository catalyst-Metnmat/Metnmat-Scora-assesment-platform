services:
  - type: web
    name: metnmat-assessment
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /healthz
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: metnmat_assessment
      - key: ADMIN_KEY
        sync: false
      - key: HR_KEY
        sync: false
